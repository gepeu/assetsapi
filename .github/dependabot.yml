# Update PRs stay regular and reviewable, with no auto-merge. New releases wait 7 days, because most
# malicious versions are found and pulled within that time.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
  # The Dockerfile is at the repository root, which is also the build context.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
